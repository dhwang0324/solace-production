name: Deploy to Hostinger

# Every push to main that changes the site builds site/ (Astro) and publishes site/dist/ to solaceproduction.com.
# Work branches (claude/*) never deploy; merge them into main to go live.
# Run manually from the Actions tab with "check_only" ticked to list what the
# FTP login sees on the server without uploading anything.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only list server folders, do not upload'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Find the web root on the server
        id: target
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          OVERRIDE: ${{ vars.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          list() { curl -sS --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_HOST/$1" | tr -d '\r'; }
          echo "== Files the FTP login sees at its starting folder =="
          root=$(list "")
          echo "$root"
          # The login opens directly in the web root. Use its absolute path: the upload
          # action deletes old folders by absolute path, which breaks with "./".
          start=$(curl -sS -v --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_HOST/" -Q PWD -o /dev/null 2>&1 | sed -n 's/^< 257 "\(.*\)".*/\1/p' | head -1)
          echo "== Login folder (absolute): ${start:-unknown} =="
          if [ -n "$start" ]; then auto="${start%/}/"; else auto="./"; fi
          dir="${OVERRIDE:-$auto}"
          echo "== Uploading into: $dir =="
          [ "$dir" = "./" ] || { echo "== Files currently in $dir =="; list "$dir"; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload site to Hostinger over FTP
        if: ${{ !inputs.check_only }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/dist/
          server-dir: ${{ steps.target.outputs.dir }}
